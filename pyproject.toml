[tool.poetry]
name = "opensesame-plugin-titta-eyetracking"
version = "7.0.5"
description = "OpenSesame plugin for Tobii eye trackers through Titta: calibration, recording, messages and gaze plotting"
authors = ["Bob Rosbag <mail@bobrosbag.nl>"]
readme = "README.md"
packages = [
    {include = "opensesame_plugins"},
]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dev-jam/opensesame-plugin-titta_eyetracking"
repository = "https://github.com/dev-jam/opensesame-plugin-titta_eyetracking"

[tool.poetry.dependencies]
python = ">= 3.10"
titta = ">= 2.2.2"
pandas = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
